<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam Seating Arrangement</title>
    <link rel="stylesheet" href="frontend/style.css" />
    <style>
      .home-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #d8dde7;
      }

      .home-card {
        width: 100%;
        max-width: 460px;
        background: #ffffff;
        border: 2px solid #243b6a;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.18);
        padding: 32px 28px;
      }

      .home-brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 20px;
        border-bottom: 1px solid #d0d6e2;
        padding-bottom: 18px;
      }

      .home-brand-label {
        font-size: 32px;
        font-family: "Times New Roman", serif;
        color: #1e3c70;
        font-style: italic;
        line-height: 1;
      }

      .home-brand-label span {
        display: block;
        font-size: 13px;
        font-style: normal;
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        color: #5b5b5b;
        font-weight: 600;
        margin-top: 4px;
        letter-spacing: 0.5px;
      }

      .home-title {
        font-size: 17px;
        font-weight: 700;
        color: #1a2d52;
        margin: 0 0 6px;
      }

      .home-sub {
        font-size: 13px;
        color: #5b5b5b;
        margin: 0 0 24px;
      }

      .home-links {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .home-link {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        padding: 14px 16px;
        border: 1px solid #5f6f8f;
        background: #f5f6f8;
        color: #101010;
        transition: background 0.15s, border-color 0.15s;
      }

      .home-link:hover {
        background: #e7edf8;
        border-color: #243b6a;
      }

      .home-link-icon {
        width: 36px;
        height: 36px;
        background: #213f73;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        padding: 8px;
      }

      .home-link-icon svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: #fff;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .home-link-text strong {
        display: block;
        font-size: 14px;
        font-weight: 700;
        color: #1a2d52;
      }

      .home-link-text small {
        font-size: 12px;
        color: #5b5b5b;
      }
    </style>
  </head>
  <body>
    <div class="home-page">
      <div class="home-card">
        <div class="home-brand">
          <div class="home-brand-label">
            Exam<br />Cell
            <span>Smart Seating System</span>
          </div>
        </div>

        <p class="home-title">Exam Seating Arrangement</p>
        <p class="home-sub">Select a section to continue</p>

        <div class="home-links">
          <a href="frontend/seat-search.html" class="home-link">
            <div class="home-link-icon">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <circle cx="11" cy="11" r="7"/>
                <line x1="16.5" y1="16.5" x2="22" y2="22"/>
              </svg>
            </div>
            <div class="home-link-text">
              <strong>Student Seat Search</strong>
              <small>Find your assigned seat by registration number</small>
            </div>
          </a>
          <a href="frontend/admin.html" class="home-link">
            <div class="home-link-icon">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <rect x="5" y="11" width="14" height="11" rx="1"/>
                <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
              </svg>
            </div>
            <div class="home-link-text">
              <strong>Admin Login</strong>
              <small>Upload excel, create exam and generate seating</small>
            </div>
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
